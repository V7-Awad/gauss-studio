[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauss-visualizer"
version = "0.1.0"
description = "Exact, step-by-step Gaussian elimination visualizer"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.6",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
